name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '31 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e6985fd516cce3b1a0e8db34a4013d2e50a1e252 # v4.32.0
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@e6985fd516cce3b1a0e8db34a4013d2e50a1e252 # v4.32.0
